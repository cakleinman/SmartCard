<style>
:root {
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEDE6;
  --text:#1B1E1A; --text-2:#5C6159; --muted:#A7ABA2; --border:#E2E0D8;
  --accent:#3B5A3A; --accent-ink:#FFFFFF;
  --success:#2F7D46; --danger:#B23A2E; --warn:#B5892B;

  --r-chip:6px; --r-btn:10px; --r-card:14px; --r-sheet:20px;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px; --s-8:40px; --s-9:56px;

  --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.04);
  --shadow-2: 0 6px 20px rgba(0,0,0,.08);

  --ease-micro: cubic-bezier(.4,0,.2,1);
  --ease-std: cubic-bezier(.2,.8,.2,1);
  --d-micro: 120ms;
  --d-std: 240ms;
  --d-flip: 320ms;

  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: ui-serif, "New York", "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E100E; --surface:#161916; --surface-2:#1E221E;
    --text:#ECEBE4; --text-2:#A7ABA2; --muted:#6A6E66; --border:#262A26;
    --accent:#B8C88C; --accent-ink:#0E100E;
    --success:#6BBF7C; --danger:#E07166; --warn:#E3B86A;
    --shadow-1: 0 0 0 1px rgba(255,255,255,.04) inset;
    --shadow-2: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04) inset;
  }
}
:root[data-theme="dark"] {
  --bg:#0E100E; --surface:#161916; --surface-2:#1E221E;
  --text:#ECEBE4; --text-2:#A7ABA2; --muted:#6A6E66; --border:#262A26;
  --accent:#B8C88C; --accent-ink:#0E100E;
  --success:#6BBF7C; --danger:#E07166; --warn:#E3B86A;
  --shadow-1: 0 0 0 1px rgba(255,255,255,.04) inset;
  --shadow-2: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04) inset;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); }
html { font-size: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: contain;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent); text-decoration: none; }

/* ---------- typography ---------- */
.t-display { font-size: 2.25rem; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
.t-h1 { font-size: 1.5rem; line-height: 1.25; font-weight: 600; letter-spacing: -0.005em; }
.t-h2 { font-size: 1.125rem; line-height: 1.3; font-weight: 600; }
.t-body { font-size: 1rem; line-height: 1.5; }
.t-passage { font-family: var(--font-serif); font-size: 1.0625rem; line-height: 1.6; }
.t-caption { font-size: .8125rem; line-height: 1.35; font-weight: 500; color: var(--text-2); }
.t-micro { font-size: .6875rem; line-height: 1.2; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); font-feature-settings: "tnum" 1; }
.t-mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
.muted { color: var(--text-2); }

/* ---------- layout shell ---------- */
#app { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: grid; grid-template-columns: 44px 1fr 44px;
  align-items: center;
  height: calc(48px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(140%) blur(12px);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar .title { text-align: center; font-weight: 600; font-size: 1rem; letter-spacing: -0.005em; }
.topbar button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--text); border-radius: 10px; }
.topbar button:active { background: var(--surface-2); }
.topbar .wordmark { font-size: .75rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-2); }

.screen { flex: 1; padding: var(--s-4); padding-bottom: calc(var(--s-9) + env(safe-area-inset-bottom)); }
.screen-narrow { max-width: 540px; margin: 0 auto; width: 100%; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 48px; padding: 0 var(--s-5);
  border-radius: var(--r-btn);
  font-weight: 600; font-size: 1rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  transition: transform var(--d-micro) var(--ease-micro), background var(--d-micro);
}
.btn:active { transform: scale(.985); background: var(--surface-2); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:active { background: color-mix(in srgb, var(--accent) 88%, black); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-block { width: 100%; }

/* ---------- card ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-1);
}
.card-pad { padding: var(--s-4); }

/* ---------- focus ---------- */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ---------- icon ---------- */
.icon { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 18px; height: 18px; }

/* ---------- home: deck list ---------- */
.home-section { margin-top: var(--s-6); }
.home-section:first-of-type { margin-top: var(--s-3); }
.section-head { position: sticky; top: calc(48px + env(safe-area-inset-top)); background: var(--bg); padding: var(--s-3) var(--s-1) var(--s-2); z-index: 5; }
.deck-row { display: grid; grid-template-columns: 1fr auto; gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--s-2); transition: background var(--d-micro); }
.deck-row:active { background: var(--surface-2); }
.deck-row .name { font-weight: 600; font-size: 1rem; color: var(--text); }
.deck-row .hint { font-size: .8125rem; color: var(--text-2); margin-top: 2px; }
.deck-row .progress { height: 2px; width: 100%; background: var(--surface-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.deck-row .progress > i { display: block; height: 100%; background: var(--accent); transition: width var(--d-std) var(--ease-std); }
.deck-row .chev { color: var(--muted); }

.continue-card { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--s-3); }
.continue-card:active { background: var(--surface-2); }
.continue-card .label { font-size: .6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.continue-card .body { font-weight: 600; margin-top: 2px; }

.review-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--accent); color: var(--accent-ink); margin-bottom: var(--s-4); font-weight: 600; }
.review-row .num { font-family: var(--font-mono); font-feature-settings: "tnum" 1; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: .875rem; }

/* ---------- deck screen ---------- */
.deck-hero { padding: var(--s-3) 0 var(--s-5); display: flex; align-items: flex-start; gap: var(--s-4); }
.ring { --pct: 0; width: 64px; height: 64px; flex: 0 0 64px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: var(--accent); stroke-dasharray: var(--circ); stroke-dashoffset: calc(var(--circ) * (1 - var(--pct))); transition: stroke-dashoffset var(--d-std) var(--ease-std); }
.ring text { fill: var(--text); font-family: var(--font-mono); font-feature-settings: "tnum" 1; font-size: 18px; font-weight: 600; transform: rotate(90deg); transform-origin: 50% 50%; }
.deck-hero .info { flex: 1; min-width: 0; }
.deck-hero .preview { color: var(--text-2); font-size: .9375rem; line-height: 1.4; margin-top: var(--s-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* segmented control */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; background: var(--surface-2); border-radius: var(--r-btn); margin: var(--s-4) 0; }
.segmented button { padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: .875rem; color: var(--text-2); transition: background var(--d-micro), color var(--d-micro); }
.segmented button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.deck-actions { display: flex; flex-direction: column; gap: var(--s-2); margin-top: var(--s-5); }

/* ---------- flashcard ---------- */
.fc-wrap { padding: var(--s-3) 0; display: flex; flex-direction: column; align-items: center; }
.fc-meta { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-3); }
.fc-progress { flex: 1; height: 2px; background: var(--surface-2); border-radius: 2px; margin: 0 var(--s-3); overflow: hidden; }
.fc-progress > i { display: block; height: 100%; background: var(--accent); transition: width var(--d-std) var(--ease-std); }
.fc-card-area { width: 88vw; max-width: 480px; min-height: 60vh; perspective: 1200px; margin: 0 auto; }
.fc-card { position: relative; width: 100%; height: 100%; min-height: 60vh; transform-style: preserve-3d; transition: transform var(--d-flip) var(--ease-std); }
.fc-card.is-flipped { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--s-6); border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-2); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.fc-face.back { transform: rotateY(180deg); }
.fc-prompt { font-size: 1.0625rem; color: var(--text-2); font-weight: 500; }
.fc-term { font-size: 2.25rem; font-weight: 600; line-height: 1.15; text-align: center; margin-top: var(--s-3); }
.fc-term.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; letter-spacing: 0.02em; }
.fc-def { font-size: 1.125rem; line-height: 1.4; text-align: center; margin-top: var(--s-3); max-width: 36ch; }
.fc-speak { position: absolute; top: var(--s-3); right: var(--s-3); width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); }
.fc-speak:active { background: var(--surface-2); }
.fc-rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); width: 88vw; max-width: 480px; margin: var(--s-4) auto 0; }
.fc-rate button { height: 52px; border-radius: var(--r-btn); border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
.fc-rate button.again { color: var(--danger); }
.fc-rate button.good { color: var(--text); }
.fc-rate button.easy { color: var(--accent); }
.fc-commit { display: flex; gap: var(--s-2); width: 88vw; max-width: 480px; margin: var(--s-4) auto 0; }
.fc-commit input { flex: 1; height: 52px; padding: 0 var(--s-4); border-radius: var(--r-btn); border: 1px solid var(--border); background: var(--surface); }
.fc-commit input:focus { border-color: var(--accent); }

/* ---------- cloze fill-in ---------- */
.cloze-wrap { padding-bottom: 96px; }
.cloze-passage { padding: var(--s-4); border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--border); }
.cloze-blank { display: inline-block; min-width: 6ch; border: 0; border-bottom: 1px solid var(--text-2); padding: 0 4px; background: transparent; font: inherit; color: var(--text); text-align: center; }
.cloze-blank:focus { border-bottom-color: var(--accent); }
.cloze-blank.is-correct { border-bottom: 1px solid var(--success); color: var(--text); }
.cloze-blank.is-wrong { border-bottom: 1px solid var(--danger); }
.cloze-blank.is-revealed { color: var(--text-2); border-bottom-color: var(--text-2); font-style: italic; }
.cloze-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: var(--s-3) var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom)); display: flex; gap: var(--s-2); align-items: center; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
.cloze-bar .hint { font-size: .8125rem; color: var(--text-2); flex: 0 0 auto; }
.cloze-bar input { flex: 1; min-width: 0; height: 44px; padding: 0 var(--s-3); border-radius: var(--r-btn); border: 1px solid var(--border); background: var(--surface); }
.cloze-bar input:focus { border-color: var(--accent); }
.cloze-bar .small { padding: 0 var(--s-3); height: 44px; min-height: 0; font-size: .875rem; }

/* ---------- type-from-memory ---------- */
.tfm-wrap { padding-bottom: 96px; }
.tfm-passage { padding: var(--s-4); border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--border); }
.tfm-line { padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--text-2); }
.tfm-line:last-child { border-bottom: 0; }
.tfm-line.current { color: var(--text); font-weight: 600; }
.tfm-line.done { color: var(--text-2); }
.tfm-line.miss { background: color-mix(in srgb, var(--danger) 8%, transparent); border-radius: 6px; padding: 6px 8px; }
.tfm-line .hint { color: var(--text-2); font-style: italic; }

/* ---------- matching ---------- */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); padding: var(--s-2) 0; }
.match-tile { padding: 12px 14px; min-height: 56px; display: flex; align-items: center; border-radius: var(--r-btn); background: var(--surface); border: 1px solid var(--border); font-size: .9375rem; line-height: 1.25; transition: transform var(--d-micro), background var(--d-micro), border-color var(--d-micro); text-align: left; cursor: pointer; }
.match-grid > .match-tile:nth-child(2n) { text-align: right; justify-content: flex-end; }
.match-tile.sel { border-color: var(--accent); background: var(--surface-2); border-width: 2px; }
.match-tile.match { background: var(--surface-2); color: var(--text-2); border-color: var(--border); transform: scale(.96); pointer-events: none; }
.match-tile.miss { animation: pulse-miss .18s var(--ease-std); }
@keyframes pulse-miss { 0%,100% { border-color: var(--border); } 50% { border-color: var(--danger); } }

/* ---------- sequencer ---------- */
.seq-placed { display: flex; flex-direction: column; gap: var(--s-2); margin-bottom: var(--s-3); min-height: 16px; }
.seq-pool { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.seq-tile { padding: 12px 14px; border-radius: var(--r-btn); background: var(--surface); border: 1px solid var(--border); font-size: .9375rem; min-height: 44px; }
.seq-tile.placed { background: var(--surface-2); color: var(--text-2); }
.seq-tile.placed .num { display: inline-block; min-width: 22px; color: var(--text-2); font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
.seq-tile.miss { animation: nudge .14s var(--ease-std); border-color: var(--danger); }
@keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* ---------- phonetic speed ---------- */
.speed-wrap { display: flex; flex-direction: column; align-items: stretch; gap: var(--s-4); padding: var(--s-3) 0; }
.speed-timer { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.speed-timer > i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
.speed-meta { display: flex; justify-content: space-between; align-items: baseline; }
.speed-prompt { font-family: var(--font-mono); font-feature-settings: "tnum" 1; font-size: 5rem; font-weight: 600; text-align: center; padding: var(--s-6) 0; line-height: 1; }
.speed-options { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
@media (orientation: landscape) and (max-height: 500px) { .speed-options { grid-template-columns: 1fr; } .speed-prompt { font-size: 3rem; padding: var(--s-3) 0; } }
.speed-options button { min-height: 64px; border-radius: var(--r-btn); border: 1px solid var(--border); background: var(--surface); font-weight: 600; }
.speed-options button.right { border-color: var(--success); color: var(--success); }
.speed-options button.wrong { border-color: var(--danger); color: var(--danger); }

/* ---------- score ---------- */
.score-screen { display: flex; flex-direction: column; align-items: center; padding: var(--s-7) var(--s-4); gap: var(--s-3); }
.score-screen .num { font-family: var(--font-mono); font-feature-settings: "tnum" 1; font-size: 5rem; font-weight: 600; line-height: 1; }
.score-screen .meta { color: var(--text-2); }
.score-bar { display: flex; width: 100%; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin: var(--s-3) 0; }
.score-bar i { display: block; height: 100%; }
.score-bar .ok { background: var(--success); }
.score-bar .no { background: var(--danger); }

/* ---------- settings sheet ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.36); z-index: 50; opacity: 0; transition: opacity var(--d-std); }
.sheet-backdrop.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--surface); border-top-left-radius: var(--r-sheet); border-top-right-radius: var(--r-sheet); padding: var(--s-5) var(--s-4) calc(var(--s-5) + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform var(--d-std) var(--ease-std); box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
.sheet.open { transform: translateY(0); }
.sheet-grab { width: 36px; height: 4px; border-radius: 4px; background: var(--muted); margin: 0 auto var(--s-3); opacity: .6; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .label { font-weight: 500; }
.setting-row .desc { color: var(--text-2); font-size: .8125rem; margin-top: 2px; }
.toggle { position: relative; width: 44px; height: 26px; background: var(--surface-2); border-radius: 999px; transition: background var(--d-micro); }

  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i-1] === b[j-1] ? prev : 1 + Math.min(prev, dp[j], dp[j-1]);
      prev = tmp;
    }
  }
  return 1 - dp[n] / Math.max(m, n);
}

// ---------- Leitner SRS store ----------
// store: { cards: { [cardId]: { box, lastSeen, lapses, modality } }, progress: { [deckId]: { studied, mastered } }, lastDeck, lastMode, banner_seen_at }
const BOX_DAYS = [0, 1, 2, 4, 7, 14]; // box 0 = new, 1..5 = scheduled
const NEW_PER_DAY_CAP = 12;
let store = { cards: {}, progress: {}, lastDeck: null, lastMode: null, newToday: { date: '', count: 0 } , scoreBest: {} };
(function loadStore() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try { store = Object.assign(store, JSON.parse(raw)); } catch {}
})();
let saveTimer = 0;
function saveStore() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch {}
  }, 250);
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function getCard(id) {
  if (!store.cards[id]) store.cards[id] = { box: 0, lastSeen: 0, lapses: 0, modality: null };
  return store.cards[id];
}
function isDue(card) {
  if (!card || card.box === 0) return false;
  const days = BOX_DAYS[card.box] || 1;
  return Date.now() - (card.lastSeen || 0) >= days * 86400000 - 3600000;
}
function recordResult(cardId, rating) { // rating: 'again' | 'hard' | 'good'
  const c = getCard(cardId);
  const wasNew = c.box === 0;
  if (rating === 'again') {
    c.lapses++;
    c.box = 1;
  } else if (rating === 'hard') {
    c.box = Math.max(1, c.box || 1);
  } else {
    c.box = Math.min(5, (c.box || 0) + 1);
  }
  c.lastSeen = Date.now();
  if (wasNew && rating !== 'again') {
    if (store.newToday.date !== todayStr()) store.newToday = { date: todayStr(), count: 0 };
    store.newToday.count++;
  }
  saveStore();
}
function deckCardIds(deckId) {
  const d = CONTENT.decks[deckId];
  if (!d) return [];
  if (d.items) return d.items.map(it => typeof it === 'string' ? `${deckId}#${it}` : it.id || `${deckId}#${it.front}`);
  if (d.lines) return d.lines.map((_, i) => `${deckId}#L${i}`);
  if (d.verses) return d.verses.flatMap((v, vi) => v.lines.map((_, li) => `${deckId}#${vi}.${li}`));
  return [];
}
function deckProgress(deckId) {
  const ids = deckCardIds(deckId);
  if (!ids.length) return { studied: 0, mastered: 0, total: 0, ratio: 0 };
  let studied = 0, mastered = 0;
  for (const id of ids) {
    const c = store.cards[id];
    if (!c) continue;
    if (c.box >= 1) studied++;
    if (c.box >= 4) mastered++;
  }
  return { studied, mastered, total: ids.length, ratio: mastered / ids.length };
}
function dueQueue(maxItems = 30) {
  const out = [];
  for (const id of Object.keys(store.cards)) {
    if (isDue(store.cards[id])) out.push(id);
  }
  return shuffle(out).slice(0, maxItems);
}
function leechModality(cardId, currentMode) {
  const c = getCard(cardId);
  if (c.lapses >= 6 && c.modality !== currentMode) {
    return currentMode === 'flash' ? 'cloze' : 'flash';
  }
  return null;
}

const routes = [];
function route(pattern, fn) { routes.push({ pattern, fn }); }
function navigate(path) { location.hash = path.startsWith('#') ? path : '#' + path; }
function handleRoute() {
  const hash = location.hash.replace(/^#/, '') || '/';
  for (const { pattern, fn } of routes) {
    const m = hash.match(pattern);
    if (m) { fn(...m.slice(1)); return; }
  }
  navigate('/');
}

function audioImportRow(id, label) {
  const row = h('div', { class: 'setting-row' });
  const left = h('div', {});
  left.appendChild(h('div', { class: 'label', text: label }));
  const status = h('div', { class: 'desc' });

  row.appendChild(left);

  const right = h('div', { style: 'display:flex;gap:6px' });
  const btn = h('button', { class: 'btn', style: 'min-height:36px;padding:0 12px;font-size:.875rem', text: stored ? 'Replace' : 'Import' });

  btn.onclick = () => file.click();
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert('That file is over 4 MB — pick a lower-bitrate MP3 (≤ 96 kbps mono is ideal).'); return; }
    const r = new FileReader();
    r.onload = () => {
      const ok = setStoredAudio(id, r.result);
      if (ok) {
        status.textContent = `Imported · ${(f.size / 1024 | 0)} KB`;
        btn.textContent = 'Replace';
        if (!row.querySelector('.rm')) right.appendChild(rmBtn);

route(/^\/d\/([^/]+)\/speed$/, (deckId) => {
  const d = CONTENT.decks[deckId];
  if (!d || !d.items) return navigate(`/d/${deckId}`);
  setTopbar({ title: d.title, leftIcon: ICON.back, leftAction: () => navigate(`/d/${deckId}`) });

  const items = d.items;
  let score = 0, asked = 0;
  let endAt = Date.now() + 60000;
  let dir = Math.random() < 0.5 ? 'fw' : 'bw'; // alternates per question
  let timerInterval = 0;
  const root = h('div', { class: 'screen-narrow speed-wrap' });
  const timerBar = h('div', { class: 'speed-timer' });
  const tBar = h('i', { style: 'width:100%' });
  timerBar.appendChild(tBar);
  const meta = h('div', { class: 'speed-meta' });
  const timeLabel = h('span', { class: 't-mono', text: '01:00' });
  const scoreLabel = h('span', { class: 't-caption', text: '0' });
  meta.append(scoreLabel, timeLabel);
  const promptEl = h('div', { class: 'speed-prompt' });
  const optsEl = h('div', { class: 'speed-options' });
  root.append(timerBar, meta, promptEl, optsEl);
  mount(root);

  function tick() {
    const ms = Math.max(0, endAt - Date.now());
    tBar.style.width = (ms / 60000 * 100) + '%';
    timeLabel.textContent = `00:${String(Math.ceil(ms / 1000)).padStart(2, '0')}`;
    if (ms <= 0) {
      clearInterval(timerInterval);
      const best = store.scoreBest[deckId + ':speed'] || 0;
      const newBest = score > best;
      if (newBest) store.scoreBest[deckId + ':speed'] = score;
      saveStore();
      return endOfSession({
        title: `${d.title} · Speed round` + (newBest ? ' · new best!' : ` · best ${best}`),
        score, total: asked,
        missedItems: [],
        onDone: () => navigate(`/d/${deckId}`)
      });
    }
  }
  timerInterval = setInterval(tick, 250);
  window.addEventListener('hashchange', () => clearInterval(timerInterval), { once: true });

  function nextQ() {
    asked++;
    dir = dir === 'fw' ? 'bw' : 'fw';
    const correct = pick(items);
    const others = shuffle(items.filter(x => x.id !== correct.id)).slice(0, 3);
    const all = shuffle([correct, ...others]);
    const promptText = dir === 'fw' ? correct.front : correct.back;
    const answerText = dir === 'fw' ? correct.back : correct.front;
    promptEl.textContent = promptText;
    optsEl.innerHTML = '';
    all.forEach(it => {
      const text = dir === 'fw' ? it.back : it.front;
      const b = h('button', { text });
      b.onclick = () => {
        if (it.id === correct.id) {
          b.classList.add('right'); score++; scoreLabel.textContent = String(score);
          recordResult(correct.id, 'good'); vibe(10);
        } else {
          b.classList.add('wrong'); recordResult(correct.id, 'again');
          vibe(20);
          const rb = $$('button', optsEl).find(x => x.textContent === answerText);
          if (rb) rb.classList.add('right');
        }
        setTimeout(nextQ, 250);
      };
      optsEl.appendChild(b);
    });
  }
  nextQ();
});

route(/^\/d\/([^/]+)\/scenario$/, (deckId) => {
  const d = CONTENT.decks[deckId];
  if (!d || !d.scenarios) return navigate(`/d/${deckId}`);
  setTopbar({ title: d.title, leftIcon: ICON.back, leftAction: () => navigate(`/d/${deckId}`), rightIcon: ICON.retry, rightAction: () => handleRoute() });

  const sc = pick(d.scenarios);
  const letters = ['S','A','L','U','T','E'];
  const labels = { S:'Size', A:'Activity', L:'Location', U:'Unit / Uniform', T:'Time', E:'Equipment' };
  let i = 0, score = 0, missed = [];
  const root = h('div', { class: 'screen-narrow' });
  const card = h('div', { class: 'card card-pad', style: 'margin-bottom:16px' });
  card.appendChild(h('div', { class: 't-caption', text: 'Scenario' }));
  card.appendChild(h('p', { class: 't-passage', style: 'margin:8px 0 0', text: sc.text }));
  root.appendChild(card);

  const promptCard = h('div', { class: 'card card-pad' });
  const letterEl = h('div', { class: 't-display mono', style: 'text-align:center' });
  const labelEl = h('div', { class: 't-caption', style: 'text-align:center;margin-top:4px' });
  const inp = h('input', { type: 'text', class: 'btn btn-block', style: 'margin-top:16px;text-align:center', placeholder: 'Type the answer…', autocomplete: 'off', autocapitalize: 'sentences', autocorrect: 'off', enterkeyhint: 'next' });
  const submit = h('button', { class: 'btn btn-primary btn-block', style: 'margin-top:8px', text: 'Check' });
  const reveal = h('button', { class: 'btn btn-ghost btn-block', style: 'margin-top:4px', text: 'Reveal' });
  const result = h('div', { class: 't-caption', style: 'margin-top:8px;min-height:1.4em' });
  promptCard.append(letterEl, labelEl, inp, submit, reveal, result);
  root.appendChild(promptCard);
  mount(root);

  function step() {
    if (i >= letters.length) {
      return endOfSession({ title: `${d.title} · Scenario`, score, total: letters.length, missedItems: missed, onDone: () => navigate(`/d/${deckId}`) });
    }
    const L = letters[i];
    letterEl.textContent = L;
    labelEl.textContent = labels[L];
    inp.value = ''; result.textContent = '';
    setTimeout(() => inp.focus(), 60);
  }
  function check() {
    const L = letters[i];
    const expected = sc.answers[L];
    const r = levRatio(inp.value, expected);
    if (r >= 0.55 || norm(inp.value).includes(norm(expected).split(' ')[0])) {
      score++; result.textContent = `Right — ${expected}`;
      recordResult(`salute#${L}`, 'good'); vibe(10);
    } else {
      missed.push(L); result.textContent = `Expected: ${expected}`;
      recordResult(`salute#${L}`, 'again'); vibe(20);
    }
    setTimeout(() => { i++; step(); }, 700);
  }
  function rev() { result.textContent = sc.answers[letters[i]]; missed.push(letters[i]); recordResult(`salute#${letters[i]}`, 'again'); setTimeout(() => { i++; step(); }, 700); }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  submit.onclick = check;
  reveal.onclick = rev;
  step();
});

route(/^\/d\/([^/]+)\/recall60$/, (deckId) => {
  const d = CONTENT.decks[deckId];
  if (!d || !d.items) return navigate(`/d/${deckId}`);
  setTopbar({ title: d.title, leftIcon: ICON.back, leftAction: () => navigate(`/d/${deckId}`) });

  const targets = d.items.map(it => ({ id: it.id, key: norm(it.front), full: it.front, back: it.back }));
  const found = new Set();
  let endAt = Date.now() + 60000;
  let interval = 0;
  const root = h('div', { class: 'screen-narrow' });
  root.appendChild(h('div', { class: 't-caption', text: 'Type each responsibility — short keywords are fine. 60 seconds.' }));
  const tBarWrap = h('div', { class: 'speed-timer', style: 'margin-top:8px' });
  const tBar = h('i', { style: 'width:100%' });
  tBarWrap.appendChild(tBar);
  root.appendChild(tBarWrap);
  const time = h('div', { class: 't-mono', style: 'text-align:right;margin-top:4px', text: '01:00' });
  root.appendChild(time);
  const inp = h('input', { type: 'text', class: 'btn btn-block', style: 'margin-top:16px', placeholder: 'Type a responsibility and press Enter…', autocomplete: 'off', autocapitalize: 'sentences' });
  root.appendChild(inp);
  const list = h('div', { class: 'row-gap', style: 'margin-top:16px' });
  targets.forEach(t => {
    const row = h('div', { class: 'card card-pad', data: { id: t.id }, style: 'opacity:.4' });
    row.appendChild(h('div', { class: 't-h2', text: t.full }));
    row.appendChild(h('div', { class: 'muted', style: 'font-size:.875rem', text: t.back }));
    list.appendChild(row);
  });
  root.appendChild(list);
  mount(root);
  setTimeout(() => inp.focus(), 60);

  function tick() {
    const ms = Math.max(0, endAt - Date.now());
    tBar.style.width = (ms / 60000 * 100) + '%';
    time.textContent = `00:${String(Math.ceil(ms / 1000)).padStart(2, '0')}`;
    if (ms <= 0) finish();
  }
  interval = setInterval(tick, 250);
  window.addEventListener('hashchange', () => clearInterval(interval), { once: true });

  inp.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const v = norm(inp.value);
    if (!v) return;
    let hit = null;
    for (const t of targets) {
      if (found.has(t.id)) continue;
      if (t.key.includes(v) || v.includes(t.key) || levRatio(v, t.key) > 0.7 || levRatio(v, norm(t.back)) > 0.6) { hit = t; break; }
    }
    if (hit) {
      found.add(hit.id);
      const row = list.querySelector(`[data-id="${hit.id}"]`);
      if (row) row.style.opacity = '1';
      recordResult(hit.id, 'good'); vibe(10);
      inp.value = '';
      if (found.size === targets.length) finish();
    } else {
      vibe(20);
      inp.style.borderColor = 'var(--danger)';
      setTimeout(() => inp.style.borderColor = '', 220);
    }
  });

  function finish() {
    clearInterval(interval);
    const missedNames = [];
    targets.forEach(t => { if (!found.has(t.id)) { recordResult(t.id, 'again'); missedNames.push(t.full); } });
    endOfSession({ title: `${d.title} · Recall in 60s`, score: found.size, total: targets.length, missedItems: missedNames, onDone: () => navigate(`/d/${deckId}`) });
  }
});

    return mount(root);
  }
  // Walk through due cards as flashcards (commit-then-rate)
  let idx = 0, score = 0, missed = [];
  const cardForId = (id) => {
    const [deckId] = id.split('#');
    const d = CONTENT.decks[deckId];
    if (!d) return null;
    const items = deckPairItems(deckId);
    const it = items.find(x => x.id === id);

  };

  const render = () => {
    if (idx >= due.length) {
      return endOfSession({ title: 'Daily Review', score, total: due.length, missedItems: missed, onDone: () => navigate('/') });

    const meta = h('div', { class: 'fc-meta' });

    meta.appendChild(h('span', { class: 't-caption', text: deck.title.split(' ')[0] }));

    front.appendChild(h('div', { class: 'fc-prompt', text: deck.title }));
    front.appendChild(h('div', { class: 'fc-term', text: item.front }));
    const back = h('div', { class: 'fc-face back' });
    back.appendChild(h('div', { class: 'fc-prompt', text: 'Answer' }));
    back.appendChild(h('div', { class: 'fc-def', text: item.back }));

        h('button', { class: 'good', text: 'Hard', onclick: () => { recordResult(item.id, 'hard'); score++; idx++; render(); } }),
        h('button', { class: 'easy', text: 'Good', onclick: () => { recordResult(item.id, 'good'); score++; idx++; render(); } })

});

route(/^\/d\/([^/]+)\/match$/, (deckId) => {
  const d = CONTENT.decks[deckId];
  if (!d) return navigate('/');
  setTopbar({ title: d.title, leftIcon: ICON.back, leftAction: () => navigate(`/d/${deckId}`), rightIcon: ICON.retry, rightAction: () => handleRoute() });

  const items = deckPairItems(deckId);
  if (!items.length) return navigate(`/d/${deckId}`);

  // 6 pairs per round
  const pool = shuffle(items);
  const ROUND = 6;
  let cursor = 0;
  let score = 0, totalRounds = Math.ceil(items.length / ROUND);
  let roundNo = 0;

  function startRound() {
    if (cursor >= pool.length) {
      return endOfSession({
        title: `${d.title} · Matching`,
        score, total: items.length,
        onDone: () => navigate(`/d/${deckId}`)
      });
    }
    roundNo++;
    const slice = pool.slice(cursor, cursor + ROUND);
    cursor += ROUND;

    const root = h('div', { class: 'screen-narrow' });
    root.appendChild(h('div', { class: 't-caption', text: `Round ${roundNo} of ${totalRounds} · tap a term, then its match` }));

    const grid = h('div', { class: 'match-grid' });
    const lefts = shuffle(slice).map(it => ({ side: 'L', id: it.id, label: it.front }));
    const rights = shuffle(slice).map(it => ({ side: 'R', id: it.id, label: it.back }));
    // interleave columns: L, R, L, R, ...
    const interleaved = [];
    for (let i = 0; i < slice.length; i++) {
      interleaved.push(lefts[i]);
      interleaved.push(rights[i]);
    }

    let sel = null;
    interleaved.forEach(it => {
      const tile = h('button', { class: 'match-tile', text: it.label, data: { id: it.id, side: it.side } });
      tile.onclick = () => {
        if (tile.classList.contains('match')) return;
        if (!sel) {
          sel = tile; tile.classList.add('sel'); return;
        }
        if (sel === tile) { tile.classList.remove('sel'); sel = null; return; }
        if (sel.dataset.side === tile.dataset.side) {
          // re-select
          sel.classList.remove('sel'); tile.classList.add('sel'); sel = tile; return;
        }
        const right = sel.dataset.id === tile.dataset.id;
        if (right) {
          sel.classList.remove('sel'); sel.classList.add('match'); tile.classList.add('match');
          score++;
          recordResult(it.id, 'good');
          vibe(10);
          sel = null;
          if ($$('.match-tile:not(.match)', grid).length === 0) {
            setTimeout(startRound, 350);
          }
        } else {
          sel.classList.remove('sel'); sel.classList.add('miss'); tile.classList.add('miss');
          recordResult(sel.dataset.id, 'again'); recordResult(tile.dataset.id, 'again');
          vibe(20);
          const ms = sel; const mt = tile;
          setTimeout(() => { ms.classList.remove('miss'); mt.classList.remove('miss'); }, 220);
          sel = null;
        }
      };
      grid.appendChild(tile);
    });
    root.appendChild(grid);
    mount(root);
  }
  startRound();
});

      }

      tile.classList.add('miss');
      missCount++; vibe(20);
      setTimeout(() => tile.classList.remove('miss'), 200);
    }
  }

  root.append(placedEl, poolEl, hintBtn);
  mount(root);
  renderPool();

// ============================================================
// Mode: Cloze fill-in
// ============================================================

function passageLines(deck) {
  if (deck.lines) return deck.lines.slice();
  if (deck.verses) return deck.verses.flatMap(v => v.lines.slice());
  if (deck.items && Array.isArray(deck.items) && typeof deck.items[0] === 'object') {
    return deck.items.map(it => `${it.front}: ${it.back}`);
  }
  return [];
}

function chooseBlanks(line, ratio = 0.35) {
  const tokens = line.split(/(\s+|[,.;:!?—'])/);
  const wordIdx = [];
  tokens.forEach((t, i) => {
    if (/^[A-Za-z][A-Za-z'’\-]*$/.test(t) && t.length >= 3) wordIdx.push(i);
  });
  // Deterministic seed by line content for stable blanks per session
  const N = Math.max(1, Math.round(wordIdx.length * ratio));
  const picks = new Set();
  let seed = 0; for (let i = 0; i < line.length; i++) seed = (seed * 31 + line.charCodeAt(i)) >>> 0;
  const order = wordIdx.slice();
  // pseudo-shuffle by seed
  for (let i = order.length - 1; i > 0; i--) {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    const j = seed % (i + 1);
    [order[i], order[j]] = [order[j], order[i]];
  }
  for (let i = 0; i < N && i < order.length; i++) picks.add(order[i]);
  return { tokens, picks };
}

route(/^\/d\/([^/]+)\/cloze$/, (deckId) => {
  const d = CONTENT.decks[deckId];
  if (!d) return navigate('/');
  setTopbar({ title: d.title, leftIcon: ICON.back, leftAction: () => navigate(`/d/${deckId}`), rightIcon: ICON.retry, rightAction: () => handleRoute() });

  const root = h('div', { class: 'screen-narrow cloze-wrap' });
  const lines = passageLines(d);
  if (!lines.length) {
    root.appendChild(h('div', { class: 'empty', text: 'No passage available for this deck.' }));
    return mount(root);
  }
  const passage = h('div', { class: 'cloze-passage t-passage' });
  let blanks = [];
  let total = 0, correct = 0;

  lines.forEach((line, lineIdx) => {
    const { tokens, picks } = chooseBlanks(line, 0.30);
    const p = h('p', { style: 'margin:0 0 10px' });
    tokens.forEach((tok, i) => {
      if (picks.has(i)) {
        const inp = h('input', {
          class: 'cloze-blank',
          type: 'text',
          autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
          enterkeyhint: 'next',
          'aria-label': `Blank ${blanks.length + 1}`,
          size: Math.max(4, tok.length)
        });
        inp.dataset.answer = tok;
        inp.dataset.idx = blanks.length;
        blanks.push({ el: inp, answer: tok, lineIdx });
        total++;
        p.appendChild(inp);
      } else {
        p.appendChild(document.createTextNode(tok));
      }
    });
    passage.appendChild(p);
  });
  root.appendChild(passage);

  const bar = h('div', { class: 'cloze-bar' });
  const hint = h('div', { class: 'hint', text: '' });
  const inp = h('input', { type: 'text', placeholder: 'Type the missing word…', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'next' });
  const reveal = h('button', { class: 'btn small', text: 'Reveal' });
  const skip = h('button', { class: 'btn small btn-ghost', text: 'Skip' });
  bar.append(hint, inp, reveal, skip);
  document.body.appendChild(bar);
  // remove on navigation away
  const cleanupBar = () => bar.remove();
  window.addEventListener('hashchange', cleanupBar, { once: true });

  let cur = 0;
  function focusBlank(i) {
    if (i >= blanks.length) {
      hint.textContent = '';
      inp.value = '';
      checkComplete();
      return;
    }
    cur = i;
    const b = blanks[i];
    hint.textContent = `${i + 1}/${blanks.length}`;
    inp.value = b.el.value || '';
    inp.focus({ preventScroll: false });
    b.el.scrollIntoView?.({ block: 'center', behavior: 'smooth' });
  }
  inp.addEventListener('input', () => {
    blanks[cur] && (blanks[cur].el.value = inp.value);
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submitCurrent(); }
  });
  reveal.onclick = () => { revealCurrent(); };
  skip.onclick = () => { focusBlank(cur + 1); };

  function submitCurrent() {
    const b = blanks[cur];
    if (!b) return;
    const right = norm(inp.value) === norm(b.answer);
    if (right) {
      b.el.classList.remove('is-wrong'); b.el.classList.add('is-correct');
      b.el.value = b.answer;
      correct++;
      vibe(10);
      focusBlank(cur + 1);
    } else {
      b.el.classList.add('is-wrong');
      vibe(20);
      // stay on this blank but don't shake
    }
  }
  function revealCurrent() {
    const b = blanks[cur];
    if (!b) return;
    b.el.classList.remove('is-wrong', 'is-correct'); b.el.classList.add('is-revealed');
    b.el.value = b.answer;
    focusBlank(cur + 1);
  }
  function checkComplete() {
    // Lazy summary
    const remaining = blanks.filter(b => !b.el.classList.contains('is-correct') && !b.el.classList.contains('is-revealed'));
    if (remaining.length === 0) {
      cleanupBar();
      // record progress: mark each line as 'good' if all blanks on it correct
      const lineRight = new Map();
      blanks.forEach(b => {
        const got = b.el.classList.contains('is-correct');
        const cur = lineRight.get(b.lineIdx);
        lineRight.set(b.lineIdx, cur === undefined ? got : cur && got);
      });
      lineRight.forEach((right, li) => {
        recordResult(`${deckId}#L${li}`, right ? 'good' : 'again');
      });
      endOfSession({
        title: `${d.title} · Cloze`,
        score: correct, total,
        onDone: () => navigate(`/d/${deckId}`)
      });
    }
  }

  // tap a blank to jump to it
  blanks.forEach((b, i) => {
    b.el.addEventListener('focus', () => focusBlank(i));
  });

  mount(root);
  setTimeout(() => focusBlank(0), 100);
});

  const bar = h('div', { class: 'cloze-bar' });
  const hint = h('div', { class: 'hint' });
  const inp = h('input', { type: 'text', placeholder: 'Type the line…', autocomplete: 'off', autocapitalize: 'sentences', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'send' });
  const submit = h('button', { class: 'btn btn-primary small', text: 'Check' });
  const showBtn = h('button', { class: 'btn small btn-ghost', text: 'Reveal' });
  bar.append(hint, inp, submit, showBtn);
  document.body.appendChild(bar);
  window.addEventListener('hashchange', () => bar.remove(), { once: true });

  let i = 0, score = 0, missed = [];

  function step() {
    if (i >= lines.length) {
      bar.remove();
      lineEls.forEach((el, k) => recordResult(`${deckId}#L${k}`, missed.includes(k) ? 'again' : 'good'));
      return endOfSession({
        title: `${d.title} · Type from memory`,
        score, total: lines.length,
        missedItems: missed.map(k => `Line ${k+1}`),
        onDone: () => navigate(`/d/${deckId}`)
      });
    }
    lineEls.forEach((el, k) => el.classList.toggle('current', k === i));
    hint.textContent = `${i + 1}/${lines.length}`;
    inp.value = '';
    inp.focus({ preventScroll: false });
    lineEls[i].scrollIntoView?.({ block: 'center', behavior: 'smooth' });
  }
  function check() {
    const expected = lines[i];
    const r = levRatio(inp.value, expected);
    const right = r >= 0.85;
    const el = lineEls[i];
    el.classList.remove('current', 'miss');
    el.innerHTML = '';
    if (right) {
      el.appendChild(h('span', { text: expected }));
      el.classList.add('done');
      score++; vibe(10);
    } else {
      missed.push(i);
      el.classList.add('miss');
      el.appendChild(h('span', { text: expected }));
      el.appendChild(h('div', { class: 't-caption', text: `you typed: ${inp.value || '(blank)'} · ${(r*100|0)}% match` }));
      vibe(20);
    }
    i++; step();
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  submit.onclick = check;
  showBtn.onclick = () => { missed.push(i); const el = lineEls[i]; el.classList.remove('current'); el.classList.add('miss'); el.innerHTML = ''; el.appendChild(h('span', { text: lines[i] })); i++; step(); };

  mount(root);
  setTimeout(step, 100);
});

function firstLetterHint(line) {
  return line.split(/\s+/).map(w => {
    if (!w) return '';
    if (/^[A-Za-z]/.test(w)) return w[0] + (w.length > 1 ? '_'.repeat(Math.min(w.length - 1, 4)) : '');
    return w;
  }).join(' ');
}

// ============================================================
// Mode: Flashcards (commit-before-reveal for boxes 0–1, quick review for mature)
// ============================================================

function deckPairItems(deckId) {
  const d = CONTENT.decks[deckId];
  if (!d) return [];
  if (d.items && Array.isArray(d.items) && typeof d.items[0] === 'object') {
    return d.items.map(it => ({ id: it.id, front: it.front, back: it.back }));
  }
  if (d.items && typeof d.items[0] === 'string') {
    // ordered (rank list) — use front=item, back=position
    return d.items.map((s, i) => ({ id: `${deckId}#${i}`, front: s, back: `Position ${i + 1}` }));
  }
  return [];
}

route(/^\/d\/([^/]+)\/flash(\?.*)?$/, (deckId) => {
  const d = CONTENT.decks[deckId];
  if (!d) return navigate('/');
  const items = deckPairItems(deckId);
  if (!items.length) return navigate(`/d/${deckId}`);

  // Order: due cards first, then unseen, shuffled within group
  const due = []; const unseen = []; const learned = [];
  for (const it of items) {
    const c = store.cards[it.id];
    if (!c || c.box === 0) unseen.push(it);
    else if (isDue(c)) due.push(it);
    else learned.push(it);
  }
  const order = [...shuffle(due), ...shuffle(unseen).slice(0, NEW_PER_DAY_CAP), ...shuffle(learned)];
  let total = order.length;
  let idx = 0, missed = [], correct = 0;
  // browse mode: if ?browse=1 just iterate without scoring
  const browse = location.hash.includes('browse=1');

  const render = () => {
    if (idx >= total) {
      return endOfSession({
        title: `${d.title} · Flashcards`,
        score: correct, total,
        missedItems: missed.map(m => m.front),
        onReview: missed.length ? () => {
          const ids = new Set(missed.map(m => m.id));
          const order2 = items.filter(it => ids.has(it.id));
          missed = []; correct = 0; idx = 0;
          order.length = 0; order.push(...order2);
          total = order.length;
          render();
        } : null
      });
    }
    setTopbar({ title: d.title, leftIcon: ICON.back, leftAction: () => navigate(`/d/${deckId}`), rightIcon: ICON.shuffle, rightAction: () => { shuffleRest(); render(); }, rightLabel: 'Shuffle' });
    const it = order[idx];
    const card = store.cards[it.id] || { box: 0, lapses: 0 };
    const requireCommit = !browse && card.box <= 1;

    const wrap = h('div', { class: 'screen-narrow fc-wrap' });
    const meta = h('div', { class: 'fc-meta' });
    meta.appendChild(h('span', { class: 't-caption', text: `${idx + 1} of ${total}` }));
    const pb = h('div', { class: 'fc-progress' });
    pb.appendChild(h('i', { style: `width:${(idx / total) * 100}%` }));
    meta.appendChild(pb);
    meta.appendChild(h('span', { class: 't-caption', text: `box ${card.box || 0}` }));
    wrap.appendChild(meta);

    const area = h('div', { class: 'fc-card-area' });
    const inner = h('div', { class: 'fc-card', tabindex: '0', 'aria-live': 'polite' });
    const front = h('div', { class: 'fc-face front' });
    if (deckId === 'phonetic' || deckId === 'numbers') {
      front.appendChild(h('div', { class: 'fc-prompt', text: 'Letter / digit' }));
      front.appendChild(h('div', { class: 'fc-term mono', text: it.front }));
    } else {
      front.appendChild(h('div', { class: 'fc-prompt', text: pairFrontPrompt(d) }));
      front.appendChild(h('div', { class: 'fc-term', text: it.front }));
    }
    if (settings.tts) {
      const sp = h('button', { class: 'fc-speak', 'aria-label': 'Read aloud' });
      sp.innerHTML = ICON.speaker;
      sp.onclick = (e) => { e.stopPropagation(); speak(deckId === 'phonetic' ? `${it.front}, ${it.back}` : it.front); };
      front.appendChild(sp);
    }

    const back = h('div', { class: 'fc-face back' });
    back.appendChild(h('div', { class: 'fc-prompt', text: pairBackPrompt(d) }));
    back.appendChild(h('div', { class: 'fc-def', text: it.back }));
    inner.append(front, back);
    area.appendChild(inner);
    wrap.appendChild(area);

    let revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      inner.classList.add('is-flipped');
      setTimeout(showRate, 320);
      if (settings.tts) speak(it.back);
    }
    inner.onclick = () => { if (!requireCommit) reveal(); };

    // commit input (for new cards)
    if (requireCommit) {
      const commit = h('div', { class: 'fc-commit' });
      const inp = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'go', placeholder: 'Type the answer…' });
      const go = h('button', { class: 'btn btn-primary', text: 'Check' });
      commit.append(inp, go);
      wrap.appendChild(commit);
      const submit = () => {
        const r = levRatio(inp.value, it.back);
        const right = r >= 0.85;
        if (!right) { missed.push(it); commit.style.borderColor = ''; inp.style.borderColor = 'var(--danger)'; }
        else { correct++; }
        recordResult(it.id, right ? 'good' : 'again');
        reveal();
      };
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      go.onclick = submit;
      const skip = h('button', { class: 'btn btn-ghost', style: 'margin:8px auto 0;display:block', text: 'Skip — show me', onclick: () => { reveal(); } });
      wrap.appendChild(skip);
      setTimeout(() => inp.focus({ preventScroll: true }), 60);
    }

    function showRate() {
      // For mature cards (no commit), show 3-button rating; for new cards, just continue
      if (requireCommit) {
        const next = h('div', { class: 'fc-rate', style: 'grid-template-columns:1fr' });
        next.appendChild(h('button', { class: 'btn btn-primary', text: 'Next', onclick: () => { idx++; render(); } }));
        wrap.appendChild(next);
        return;
      }
      const rate = h('div', { class: 'fc-rate' });
      const ag = h('button', { class: 'again', text: 'Again', onclick: () => { recordResult(it.id, 'again'); missed.push(it); vibe(20); idx++; render(); } });
      const hd = h('button', { class: 'good', text: 'Hard', onclick: () => { recordResult(it.id, 'hard'); correct++; vibe(10); idx++; render(); } });
      const ez = h('button', { class: 'easy', text: 'Good', onclick: () => { recordResult(it.id, 'good'); correct++; vibe(10); idx++; render(); } });
      rate.append(ag, hd, ez);
      wrap.appendChild(rate);
    }

    mount(wrap);
    if (settings.tts && !requireCommit) speak(it.front);
  };

  function shuffleRest() {
    const rest = order.slice(idx);
    const sh = shuffle(rest);
    for (let i = 0; i < sh.length; i++) order[idx + i] = sh[i];
  }

  render();
});

function pairFrontPrompt(deck) {
  if (deck.title.includes('LDRSHIP')) return 'Value';
  if (deck.title.includes('Phonetic')) return 'Letter';
  if (deck.title.includes('SALUTE')) return 'Letter';
  if (deck.title.includes('Numbers')) return 'Digit';
  if (deck.title.includes('Battle Buddy')) return 'Concept';
  if (deck.title.includes('Orders')) return 'Order';
  return 'Term';
}
function pairBackPrompt(deck) {
  if (deck.title.includes('LDRSHIP')) return 'Definition';
  if (deck.title.includes('Phonetic') || deck.title.includes('Numbers')) return 'Pronunciation';
  if (deck.title.includes('SALUTE')) return 'Element';
  if (deck.title.includes('Orders')) return 'Text';
  return 'Answer';
}

// ============================================================
// Score / end-of-session screen (shared)
// ============================================================
function endOfSession({ title, score, total, missedItems = [], onReview, onDone }) {
  const root = h('div', { class: 'screen-narrow' });
  const card = h('div', { class: 'score-screen card' });
  card.appendChild(h('div', { class: 't-caption', text: title || 'Session complete' }));
  card.appendChild(h('div', { class: 'num', text: `${score}/${total}` }));
  card.appendChild(h('div', { class: 'meta', text: `${Math.round(100 * (score / Math.max(1, total)))}% correct` }));
  const bar = h('div', { class: 'score-bar' });
  bar.appendChild(h('i', { class: 'ok', style: `width:${(score/Math.max(1,total))*100}%` }));
  bar.appendChild(h('i', { class: 'no', style: `width:${((total-score)/Math.max(1,total))*100}%` }));
  card.appendChild(bar);
  if (missedItems.length) {
    card.appendChild(h('div', { class: 't-caption', style: 'margin-top:8px', text: 'Missed: ' + missedItems.slice(0,3).join(', ') + (missedItems.length > 3 ? '…' : '') }));
  }
  const actions = h('div', { class: 'row-gap', style: 'width:100%;margin-top:16px' });
  if (onReview) actions.appendChild(h('button', { class: 'btn btn-primary btn-block', onclick: onReview }, 'Review misses'));
  actions.appendChild(h('button', { class: 'btn btn-block', onclick: onDone || (() => navigate('/')) }, 'Done'));
  card.appendChild(actions);
  root.appendChild(card);
  mount(root);
  vibe([15, 40, 15]);
}

// ============================================================
// Boot
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  if (!location.hash) location.hash = '#/';
  handleRoute();
});

</script>
